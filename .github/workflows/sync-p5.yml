name: Sync official P5 results
on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest 500 official draws
        run: python scripts/fetch_data.py
        env:
          SPORTTERY_GAME_NO: "350133"
          SPORTTERY_PAGE_SIZE: "100"
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.json
          git diff --cached --quiet || git commit -m "Update official P5 draw data"
          git push
